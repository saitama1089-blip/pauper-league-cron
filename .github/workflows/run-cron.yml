name: Scrape Pauper League Results

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

env:
  ENABLE_TRIGGER: "true"
  CHALLENGE_LOOKBACK_DAYS: "16"

concurrency:
  group: league-scrape-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 requests

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python PauperBatchLeagues_API.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            *.log
          retention-days: 7

      - name: Trigger pauper-decklist-cron
        if: ${{ !cancelled() && env.ENABLE_TRIGGER == 'true' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_CONCLUSION: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open('deck-sync-dispatch.json', 'w') as target:
              json.dump({'event_type': 'league-cron-complete', 'client_payload': {
                  'source_run_id': os.environ['SOURCE_RUN_ID'],
                  'source_conclusion': os.environ['SOURCE_CONCLUSION'],
                  'source_completed_at': datetime.now(timezone.utc).isoformat(),
              }}, target)
          PY
          curl --fail-with-body --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/saitama1089-blip/pauper-decklist-cron/dispatches \
            --data @deck-sync-dispatch.json \
            --write-out 'Dispatch HTTP %{http_code}\n'
